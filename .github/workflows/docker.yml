name: Docker Build

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MAJOR: "1"
  MINOR: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Version berechnen
        id: version
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            VERSION="${MAJOR}.${MINOR}.${{ github.run_number }}-${BUILD_DATE}"
            EXTRA_TAG="latest"
          else
            VERSION="nightly-${{ github.run_number }}-${BUILD_DATE}"
            EXTRA_TAG="nightly"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "extra_tag=${EXTRA_TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.extra_tag }}
